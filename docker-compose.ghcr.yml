services:
  store_manager:
    image: ghcr.io/log430-a26-eq11/lab05:latest
    container_name: store_manager
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: labo05_db
      DB_USER: labo05
      DB_PASSWORD: labo05
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    ports: ["5000:5000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  payments_api:
    image: ghcr.io/log430-a26-eq11/lab05_payment:latest
    container_name: payments_api
    environment:
      DB_HOST: mysql_payments
      DB_PORT: 3306
      DB_NAME: labo05_payments_db
      DB_USER: labo05
      DB_PASSWORD: labo05
    ports: ["5009:5009"]
    depends_on:
      mysql_payments: { condition: service_healthy }

  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: labo05_db
      MYSQL_USER: labo05
      MYSQL_PASSWORD: labo05
    volumes: ["./db-init:/docker-entrypoint-initdb.d"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 5s
      retries: 20

  mysql_payments:
    image: mysql:8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: labo05_payments_db
      MYSQL_USER: labo05
      MYSQL_PASSWORD: labo05
    volumes: ["../Lab05_payment/db-init:/docker-entrypoint-initdb.d"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7

  krakend:
    image: devopsfaith/krakend:2.7
    container_name: api-gateway
    volumes: ["./config/krakend.json:/etc/krakend/krakend.json"]
    ports: ["8080:8080"]